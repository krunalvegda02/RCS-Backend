# /etc/nginx/sites-available/rcssender
# Optimized for 4-5K webhooks/sec

# ---------- RATE LIMIT ZONES ----------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:20m rate=10000r/s;  # 10K/sec for safety
limit_req_status 429;

# ---------- BACKEND UPSTREAM ----------
upstream backend {
    server 127.0.0.1:5000;
    keepalive 64;  # Increased for high volume
}

server {
    listen 80;
    server_name rcssender.com www.rcssender.com;

    # ---------- FRONTEND (Vue/React dist) ----------
    root /var/www/rcs-frontend/dist;
    index index.html;

    # ---------- 1. BACKEND API ----------
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---------- 2. WEBHOOK ENDPOINT (NO RATE LIMIT) ----------
    location /api/v1/jio/rcs/webhooks {
        # NO rate limit for webhooks - trust Jio source
        # If you need rate limit, use: limit_req zone=webhook_limit burst=20000 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Fast timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;

        # No buffering for maximum speed
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 3. FRONTEND ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- STATIC ASSET CACHE ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
